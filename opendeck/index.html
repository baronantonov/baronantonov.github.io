<!DOCTYPE html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Open Deck DJ School – TMA</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@500;600;700;800;900&family=Syne:wght@600;700;800&family=Unbounded:wght@400;600;700;900&display=swap" rel="stylesheet" />
    <style>
      * {
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        -webkit-user-select: none;
           -moz-user-select: none;
                user-select: none;
        box-sizing: border-box;
      }
      
      /* Wrapper to trick iframe into giving us full height, and center the phone */
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 850px; /* Force iframe to expand */
        background-color: #18181b; /* Outer IDE background */
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      }

      /* 9:16 Mobile Phone Simulator */
      .phone-simulator {
        width: 100%;
        height: 100vh; /* fallback */
        height: 800px;
        max-width: 450px;
        aspect-ratio: 9 / 16;
        background-color: #2b302e; /* Brand bg */
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      /* Add physical device bezels if viewed on a large enough screen (like desktop preview) */
      @media (min-width: 480px) and (min-height: 820px) {
        .phone-simulator {
          border-radius: 40px;
          border: 14px solid #000000;
          box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 0 0 2px rgba(255,255,255,0.1);
        }
      }

      #root {
        width: 100%;
        height: 100%;
        overflow: hidden; /* Keep app strictly inside the screen */
        display: flex;
        flex-direction: column;
      }

      /* Custom scrollbar for the inner content */
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.1);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(140, 226, 200, 0.2);
        border-radius: 4px;
      }
    </style>
